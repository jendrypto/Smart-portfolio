[workspace]
resolver = "2"
members = [
    "smart-portfolio",
]

[workspace.dependencies]
hyperware_process_lib = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
wit-bindgen = "0.42.1"
url = "2.5"
http = "1.0"
anyhow = "1.0"
rust_decimal = { version = "1.33", features = ["serde", "serde-with-str"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
